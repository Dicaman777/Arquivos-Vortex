<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regras da Internet · Arquivo Vórtex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="../back-home.js" defer></script>
    <div class="container">
        <header>
            <h1>Regras da Internet</h1>
            <p class="subtitle" id="versao-label">Versão remodelada / refeita para a atualidade</p>
            <div class="version-toggle">
                <a id="toggle-link">🔗 Regras originais</a>
            </div>
            <p class="rule-count">Total de regras: <span id="count"></span></p>
        </header>

        <main>
            <ol class="rules-list" id="rules-list">
                <!-- Preenchido via JavaScript -->
            </ol>
        </main>

        <footer>
            <p style="margin-top: 6px; font-size: 0.8rem; color: #666;">
                Preservação digital · <a id="toggle-footer" style="cursor:pointer;">Ver versão original</a>
            </p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
